name: Repository hygiene

# Runs on every push and PR (no paths filter): the check is cheap and must not
# be skipped by a path rule, because a violation can be introduced by any commit.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitignore:
    name: No tracked file is gitignored
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail if a tracked file matches .gitignore
        shell: bash
        run: |
          # A tracked file that .gitignore matches means someone force-added an
          # artifact (git add -f) or a rule is wrong. Either way the repository
          # carries something it says it should not. List it and fail.
          # --no-index is required: without it git skips files it already tracks.
          offenders="$(git ls-files | git check-ignore --stdin --no-index || true)"
          if [ -n "$offenders" ]; then
            echo "::error::These tracked files match .gitignore (remove them with 'git rm --cached' or fix the rule):"
            echo "$offenders"
            exit 1
          fi
          echo "OK: no tracked file matches .gitignore"

      - name: Check .gitignore for inline comments
        shell: bash
        run: |
          # .gitignore has no inline comments: a line like "*.exe # note" is a
          # pattern for a file literally named "*.exe # note", so the rule is
          # dead and the intended ignore never happens. Flag such lines.
          bad="$(grep -nE '^[^#[:space:]].*[[:space:]]+#' .gitignore || true)"
          if [ -n "$bad" ]; then
            echo "::error::.gitignore has inline comments (not supported); put each comment on its own line:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no inline comments in .gitignore"
