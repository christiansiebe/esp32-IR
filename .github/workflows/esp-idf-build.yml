name: ESP-IDF firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (aggregation)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile the adaptive sender sleep path
        shell: bash
        run: |
          # The adaptive light sleep is enabled by default in Kconfig; this
          # compiles its branch of uart_sleep_window.c explicitly so it cannot
          # rot silently. IDF headers are stubbed, so this checks C syntax only.
          gcc -std=c11 -fsyntax-only \
            -DCONFIG_ESPNOW_SENDER_LIGHT_SLEEP=1 \
            -DSOC_LIGHT_SLEEP_SUPPORTED=1 \
            -I test/host/include \
            main/uart_sleep_window.c

      - name: Compile the ESP-NOW power-save path
        shell: bash
        run: |
          # The ESP-NOW RX power save is opt-in (default n), so its real branch
          # of power_tuning.c is only compiled when the flag is set. Syntax-check
          # both the disabled and the enabled branch so neither can rot.
          gcc -std=c11 -fsyntax-only -I test/host/include main/power_tuning.c
          gcc -std=c11 -fsyntax-only \
            -DCONFIG_ESPNOW_RX_POWER_SAVE=1 \
            -I test/host/include \
            main/power_tuning.c

      - name: Run aggregation / data-gap / day-boundary tests
        shell: bash
        run: ./test/run_host_tests.sh

      - name: Run Home Assistant import helper tests
        shell: bash
        run: |
          python3 test/test_ha_stats.py
          python3 test/test_ws_min.py
          python3 test/test_ws_client.py
          python3 test/check_dashboard_js.py

  build:
    name: Build ${{ matrix.role }}
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: receiver
            kconfig_role: RECEIVER
          # The sender ships as a single image with the adaptive light sleep
          # enabled by default (CONFIG_ESPNOW_SENDER_LIGHT_SLEEP=y in Kconfig).
          - role: sender
            kconfig_role: SENDER
    env:
      IDF_CCACHE_ENABLE: "1"
      CCACHE_DIR: /root/.cache/ccache
      IDF_TARGET: esp32

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: ${{ runner.os }}-idf-6.1-${{ matrix.role }}-${{ hashFiles('main/main.c', 'main/CMakeLists.txt', 'components/sml_parser/**', 'components/sml_transport/**', 'CMakeLists.txt', 'partitions.csv') }}
          restore-keys: |
            ${{ runner.os }}-idf-6.1-${{ matrix.role }}-

      - name: Configure firmware role
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/sdkconfig.defaults" <<EOF
          CONFIG_IDF_TARGET="esp32"
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"
          CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
          CONFIG_ESPNOW_ROLE_${{ matrix.kconfig_role }}=y
          EOF
          echo "SDKCONFIG_DEFAULTS=sdkconfig.defaults;$RUNNER_TEMP/sdkconfig.defaults" >> "$GITHUB_ENV"

      - name: Build firmware
        shell: bash
        run: |
          source "${IDF_PATH:-/opt/esp/idf}/export.sh"
          idf.py --version
          idf.py -B "build/${{ matrix.role }}" build

      - name: Verify the variable CPU clock is in effect
        shell: bash
        run: |
          set -euo pipefail
          conf="sdkconfig"
          # 80 MHz ceiling, scaled down by dynamic frequency scaling (DFS), with
          # automatic light sleep. assert() so all mismatches are reported.
          fail=0
          assert() {
            if ! grep -q "^$1$" "$conf"; then
              echo "Expected $1 but got:"
              grep "${1%%=*}" "$conf" || echo "(not set)"
              fail=1
            fi
          }
          assert 'CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=80'
          assert 'CONFIG_PM_ENABLE=y'
          assert 'CONFIG_PM_DFS_INIT_AUTO=y'
          assert 'CONFIG_FREERTOS_USE_TICKLESS_IDLE=y'
          [ "$fail" -eq 0 ]
          echo "CPU clock: 80 MHz ceiling with DFS + tickless idle"

      - name: Verify adaptive sleep config (sender)
        if: matrix.role == 'sender'
        shell: bash
        run: |
          set -euo pipefail
          # The sender ships as one image with light sleep enabled by default.
          grep -q '^CONFIG_ESPNOW_SENDER_LIGHT_SLEEP=y$' sdkconfig
          grep -q '^CONFIG_ESPNOW_ROLE_SENDER=y$' sdkconfig
          # Guard against shipping a sender image without the sleep path. The
          # string below lives in uart_sleep_window.c's real branch only (the
          # stub build never emits it), so grepping the built app proves the
          # sleep code is actually compiled in, not just the config flag.
          test -s "build/sender/esp32-IR.bin"
          grep -a -q 'adaptive sleep path compiled in' "build/sender/esp32-IR.bin"
          echo "Sender image contains the adaptive light-sleep path"

      - name: Stage firmware and flash files
        shell: bash
        run: |
          set -euo pipefail
          build_dir="build/${{ matrix.role }}"
          out_dir="$RUNNER_TEMP/firmware"
          mkdir -p "$out_dir"

          test -s "$build_dir/esp32-IR.bin"
          test -s "$build_dir/bootloader/bootloader.bin"
          test -s "$build_dir/partition_table/partition-table.bin"
          test -s "$build_dir/flasher_args.json"
          test -s "$build_dir/ota_data_initial.bin"
          cp "$build_dir/ota_data_initial.bin" "$out_dir/ota_data_initial.bin"
          
          cp "$build_dir/esp32-IR.bin" \
            "$out_dir/${{ matrix.role }}-sml.bin"
          cp "$build_dir/bootloader/bootloader.bin" \
            "$out_dir/bootloader.bin"
          cp "$build_dir/partition_table/partition-table.bin" \
            "$out_dir/partition-table.bin"
          cp "$build_dir/flasher_args.json" \
            "$out_dir/flasher_args.json"
          cp partitions.csv "$out_dir/partitions.csv"

          # Ship the freshly generated (empty) SPIFFS image too, so a first-time
          # full flash can write a valid "storage" partition. It is NOT in
          # flasher_args.json (stripped below), so flashing the bundle as-is
          # never touches the partition and keeps the persisted history; write it
          # to 0x320000 by hand only on the very first deployment.
          if [[ -s "$build_dir/storage.bin" ]]; then
            cp "$build_dir/storage.bin" "$out_dir/storage.bin"
          else
            echo "::warning::storage.bin missing from $build_dir; first-time full flash cannot initialize storage"
          fi

          # The aggregate bundle must never write the SPIFFS "storage"
          # partition: flashing a blank storage.bin wipes the persisted
          # minute history. Strip the storage entry so flashing this bundle
          # keeps the data; OTA updates never touch it either.
          python3 - "$out_dir/flasher_args.json" "${{ matrix.role }}" <<'PYEOF'
          import json, os, sys
          path, role = sys.argv[1], sys.argv[2]
          with open(path) as fh:
              args = json.load(fh)

          # The bundle is staged flat (no bootloader/ or partition_table/ subdir),
          # so rewrite every path to its basename; otherwise `esptool write_flash
          # @flasher_args.json` cannot find bootloader/bootloader.bin.
          for off, val in list(args.get("flash_files", {}).items()):
              if str(val).endswith("storage.bin"):
                  del args["flash_files"][off]
                  continue
              args["flash_files"][off] = os.path.basename(str(val))

          app_name = f"{role}-sml.bin"
          for off, val in args.get("flash_files", {}).items():
              if val == "esp32-IR.bin":
                  args["flash_files"][off] = app_name
          args.get("flash_settings", {}).pop("storage", None)
          args.pop("storage", None)
          for key, fname in (("bootloader", "bootloader.bin"),
                             ("partition-table", "partition-table.bin"),
                             ("app", app_name)):
              if key in args:
                  args[key]["file"] = fname
          with open(path, "w") as fh:
              json.dump(args, fh, indent=4)
          print(f"flasher_args.json: flat paths, storage stripped, app -> {app_name}")

          # flasher_args.json is metadata for idf.py, not an esptool argument
          # file. Emit the esptool-native flash_project_args (flat paths) so
          # `esptool write_flash @flash_project_args` works directly.
          arg_path = os.path.join(os.path.dirname(path), "flash_project_args")
          parts = list(args.get("write_flash_args", []))
          for off, val in args["flash_files"].items():
              parts += [off, val]
          with open(arg_path, "w") as fh:
              fh.write(" ".join(parts) + "\n")
          print("flash_project_args written for direct esptool use")
          PYEOF

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.role }}-sml-firmware
          path: ${{ runner.temp }}/firmware/${{ matrix.role }}-sml.bin
          if-no-files-found: error
          retention-days: 14

      
      - name: Upload complete flash files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.role }}-sml-flash-files
          path: ${{ runner.temp }}/firmware/
          if-no-files-found: error
          retention-days: 14
