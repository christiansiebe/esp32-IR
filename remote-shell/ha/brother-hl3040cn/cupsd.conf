# CUPS config for the Brother HL-3040CN print server.
#
# Bound to 0.0.0.0:631 inside the container. Published to the LAN via docker
# -p; the host's firewall is expected to keep 631 inside the home network.
# No authentication: the box is a LAN-only print server (like the printer's
# own embedded server, which is also unauthenticated).
LogLevel warn
MaxLogSize 0
Listen 0.0.0.0:631

# Browse/announce on the LAN so clients can auto-discover the queue.
Browsing On
BrowseLocalProtocols none

# Reachable under any hostname the client uses.
ServerAlias *

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow all
</Location>

# Allow jobs from anywhere on the LAN (no auth, by design).
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit All>
    Order allow,deny
    Allow all
  </Limit>
</Policy>
